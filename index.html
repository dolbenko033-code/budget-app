<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Семейные финансы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f1115);
      --card: var(--tg-theme-secondary-bg-color, #1a1e26);
      --text: var(--tg-theme-text-color, #f4f6f8);
      --hint: var(--tg-theme-hint-color, #8e98a8);
      --accent: var(--tg-theme-button-color, #3b82f6);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f59e0b;
      --border: rgba(142, 152, 168, 0.16);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 14px 14px 92px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .summary-card {
      background: linear-gradient(135deg, rgba(59,130,246,0.18), rgba(34,197,94,0.10));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .summary-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--hint);
      margin-bottom: 6px;
      gap: 8px;
    }
    .top-badges { display: flex; align-items: center; gap: 6px; }
    .sync-tag { font-size: 11px; color: var(--accent); display: none; }
    .user-badge {
      background: var(--card);
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 12px;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .total-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 4px 0 8px;
    }
    .total-amount { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
    .curr-toggle {
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: 10px;
      padding: 6px 11px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .rate-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--hint);
    }
    .rate-refresh {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 12px;
      cursor: pointer;
      padding: 2px 6px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--card);
      padding: 5px;
      border-radius: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      border: none;
      background: transparent;
      color: var(--hint);
      padding: 9px 4px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--accent); color: var(--accent-text); }

    .account-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .acc-byn { font-size: 24px; font-weight: 700; line-height: 1.2; }
    .acc-usd { font-size: 16px; font-weight: 600; color: var(--green); margin-top: 4px; }
    .acc-eq { text-align: right; font-size: 12px; color: var(--hint); }
    .acc-eq strong { display: block; font-size: 14px; color: var(--text); margin-top: 2px; }

    /* Цели в Копилке */
    .goals-box { margin-bottom: 14px; }
    .goals-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .goals-head span { font-size: 13px; font-weight: 700; color: var(--hint); }
    .small-add-btn {
      background: rgba(59,130,246,0.16);
      color: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .goal-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .goal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .goal-title { font-size: 14px; font-weight: 700; }
    .goal-nums {
      font-size: 12px;
      color: var(--hint);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .goal-bar-bg {
      height: 8px;
      background: rgba(142,152,168,0.18);
      border-radius: 99px;
      overflow: hidden;
    }
    .goal-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #22c55e);
      border-radius: 99px;
      transition: width 0.25s;
    }
    .goal-actions { display: flex; gap: 6px; }
    .icon-btn {
      background: rgba(142,152,168,0.14);
      border: none;
      color: var(--text);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .icon-btn.green { background: rgba(34,197,94,0.18); color: var(--green); }
    .icon-btn.red { background: rgba(239,68,68,0.14); color: var(--red); }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .act-btn {
      border: none;
      border-radius: 14px;
      padding: 12px 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
    }
    .act-exp { background: #dc2626; }
    .act-inc { background: #16a34a; }
    .act-trf { background: #2563eb; }

    /* Поиск */
    .search-wrap { position: relative; margin-bottom: 10px; }
    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 36px 10px 12px;
      font-size: 14px;
      outline: none;
    }
    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--hint);
      font-size: 16px;
      cursor: pointer;
      display: none;
      padding: 4px;
    }
    .search-summary {
      background: rgba(59,130,246,0.12);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 12px;
      margin-bottom: 10px;
      display: none;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pill-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--hint);
      padding: 6px 11px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .pill.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .date-header {
      font-size: 12px;
      color: var(--hint);
      font-weight: 600;
      margin: 12px 2px 6px;
    }
    .op-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 12px;
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .op-left { min-width: 0; flex: 1; }
    .op-cat { font-size: 14px; font-weight: 600; }
    .op-meta {
      font-size: 12px;
      color: var(--hint);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .op-right { text-align: right; display: flex; align-items: center; gap: 5px; }
    .op-sum { font-size: 14px; font-weight: 700; white-space: nowrap; margin-right: 2px; }
    .sum-inc { color: var(--green); }
    .sum-exp { color: var(--red); }
    .sum-trf { color: var(--accent); }
    .op-act-btn {
      background: none;
      border: none;
      color: var(--hint);
      font-size: 15px;
      padding: 4px;
      cursor: pointer;
    }

    /* Обязательные траты */
    .add-rem-btn {
      width: 100%;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: 14px;
      padding: 13px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .rem-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px;
      margin-bottom: 10px;
    }
    .rem-card.due {
      border-color: rgba(245, 158, 11, 0.55);
      background: linear-gradient(135deg, rgba(245,158,11,0.10), transparent);
    }
    .rem-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .rem-title { font-size: 15px; font-weight: 700; }
    .rem-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 99px;
      white-space: nowrap;
    }
    .badge-due { background: rgba(245,158,11,0.2); color: var(--orange); }
    .badge-wait { background: rgba(142,152,168,0.16); color: var(--hint); }
    .badge-done { background: rgba(34,197,94,0.18); color: var(--green); }
    .rem-meta {
      font-size: 12px;
      color: var(--hint);
      margin-top: 6px;
      line-height: 1.45;
    }
    .rem-actions {
      display: flex;
      gap: 7px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .rem-btn-done {
      flex: 1;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .rem-btn-pay {
      flex: 1;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .rem-btn-edit {
      background: rgba(142,152,168,0.18);
      color: var(--text);
      border: none;
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 13px;
      cursor: pointer;
    }
    .rem-btn-del {
      background: rgba(239,68,68,0.14);
      color: var(--red);
      border: none;
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 13px;
      cursor: pointer;
    }

    /* Статистика */
    .month-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 10px;
    }
    .month-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 10px;
    }
    .stat-kpis {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 12px;
    }
    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 8px;
      text-align: center;
    }
    .kpi-label { font-size: 11px; color: var(--hint); }
    .kpi-val { font-size: 13px; font-weight: 700; margin-top: 3px; }
    .stat-row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .stat-top {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .bar-bg {
      height: 7px;
      background: rgba(142,152,168,0.18);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar-fill { height: 100%; background: var(--accent); border-radius: 99px; }

    /* Нижняя навигация */
    .bottom-nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 7px 10px 13px;
      gap: 6px;
      z-index: 20;
    }
    .nav-btn {
      border: none;
      background: transparent;
      color: var(--hint);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 4px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      position: relative;
    }
    .nav-btn .ico { font-size: 17px; line-height: 1; }
    .nav-btn.active { background: rgba(59,130,246,0.16); color: var(--accent); }
    .nav-dot {
      position: absolute;
      top: 4px;
      right: 18%;
      background: var(--orange);
      color: #000;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 99px;
      display: none;
    }

    /* Модальные окна */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.62);
      display: none;
      align-items: flex-end;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--bg);
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 22px 22px 0 0;
      padding: 18px 16px 26px;
      border-top: 1px solid var(--border);
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .modal-title { font-size: 18px; font-weight: 700; }
    .close-btn {
      background: var(--card);
      border: none;
      color: var(--text);
      width: 32px; height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }
    .field-label {
      font-size: 12px;
      color: var(--hint);
      margin: 10px 0 6px;
      display: block;
    }
    .input-row { display: flex; gap: 8px; }
    input, select {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }
    .check-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 12px;
      background: var(--card);
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 13px;
      line-height: 1.35;
    }
    .check-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .curr-switch {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3px;
      flex-shrink: 0;
    }
    .curr-opt {
      border: none;
      background: transparent;
      color: var(--hint);
      padding: 8px 14px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }
    .curr-opt.active { background: var(--accent); color: var(--accent-text); }
    .cat-grid { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 6px; }
    .cat-chip {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .cat-chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .save-btn {
      width: 100%;
      margin-top: 16px;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .save-btn:disabled { opacity: 0.55; }

    .loader, .empty {
      text-align: center;
      color: var(--hint);
      padding: 24px 10px;
      font-size: 14px;
    }
    .toast {
      position: fixed;
      top: 14px; left: 50%;
      transform: translateX(-50%);
      background: #1f2937;
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      z-index: 100;
      display: none;
      max-width: 90%;
      text-align: center;
    }
  </style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- Сводная карточка -->
<div class="summary-card">
  <div class="summary-top">
    <span>Общий капитал (все счета)</span>
    <div class="top-badges">
      <span id="syncTag" class="sync-tag">↻ Синхр...</span>
      <span id="userBadge" class="user-badge">Загрузка...</span>
    </div>
  </div>
  <div class="total-row">
    <div id="totalAmount" class="total-amount">—</div>
    <button id="summaryCurrBtn" class="curr-toggle" onclick="toggleSummaryCurrency()">BYN ⇄</button>
  </div>
  <div class="rate-row">
    <span id="rateInfo">Курс USD: загрузка...</span>
    <button class="rate-refresh" onclick="loadData(true)">↻ Обновить курс</button>
  </div>
</div>

<!-- Блок Операций -->
<div id="viewOps">
  <div class="tabs" id="accountTabs">
    <button class="tab-btn active" onclick="selectAccount('Основной')">Основной</button>
    <button class="tab-btn" onclick="selectAccount('Копилка')">Копилка</button>
    <button class="tab-btn" onclick="selectAccount('Подарочные')">Подарочные</button>
  </div>

  <div class="account-card">
    <div>
      <div id="accByn" class="acc-byn">0.00 BYN</div>
      <div id="accUsd" class="acc-usd">0.00 $</div>
    </div>
    <div class="acc-eq">
      <span>Итого на счёте</span>
      <strong id="accTotalEq">0.00 BYN</strong>
    </div>
  </div>

  <!-- Цели в Копилке -->
  <div id="goalsBox" class="goals-box" style="display:none;">
    <div class="goals-head">
      <span>🎯 Цели в Копилке</span>
      <button class="small-add-btn" onclick="openGoalModal()">+ Цель</button>
    </div>
    <div id="goalsList"></div>
  </div>

  <div class="actions">
    <button class="act-btn act-exp" onclick="openModal('Расход')">− Расход</button>
    <button class="act-btn act-inc" onclick="openModal('Доход')">+ Доход</button>
    <button class="act-btn act-trf" onclick="openModal('Перевод')">⇄ Перевод</button>
  </div>

  <!-- Поиск по истории -->
  <div class="search-wrap">
    <input id="searchInput" class="search-input" type="text" placeholder="🔍 Поиск: евроопт, ремонт, корм, 100..." oninput="onSearchInput()">
    <button id="searchClear" class="search-clear" onclick="clearSearch()">✕</button>
  </div>
  <div id="searchSummary" class="search-summary"></div>

  <div class="section-head">
    <div class="pill-group" id="authorFilters"></div>
    <button id="scopeBtn" class="pill" onclick="toggleScope()">Только этот счёт</button>
  </div>
  <div id="opsList"><div class="loader">Загружаем данные из таблицы...</div></div>
</div>

<!-- Блок Обязательных трат -->
<div id="viewReminders" style="display:none;">
  <button class="add-rem-btn" onclick="openRemModal()">+ Добавить обязательную трату</button>
  <div class="section-head">
    <div class="pill-group">
      <button id="remFilterAct" class="pill active" onclick="setRemFilter('Активно')">Активные</button>
      <button id="remFilterDone" class="pill" onclick="setRemFilter('Выполнено')">Выполненные</button>
    </div>
  </div>
  <div id="remList"></div>
</div>

<!-- Блок Статистики -->
<div id="viewStats" style="display:none;">
  <div class="month-bar">
    <button class="month-btn" onclick="shiftMonth(-1)">‹</button>
    <strong id="monthLabel"></strong>
    <button class="month-btn" onclick="shiftMonth(1)">›</button>
  </div>
  <div id="statKpis" class="stat-kpis"></div>
  <div class="section-head">
    <div class="pill-group">
      <button id="stExpBtn" class="pill active" onclick="setStatType('Расход')">Расходы</button>
      <button id="stIncBtn" class="pill" onclick="setStatType('Доход')">Доходы</button>
    </div>
    <div class="pill-group" id="statAuthorFilters"></div>
  </div>
  <div id="statsList"></div>
</div>

<!-- Нижняя навигация -->
<div class="bottom-nav">
  <button id="navOps" class="nav-btn active" onclick="switchView('ops')">
    <span class="ico">📋</span><span>Операции</span>
  </button>
  <button id="navRem" class="nav-btn" onclick="switchView('reminders')">
    <span class="ico">🔔</span><span>Обязательные</span>
    <span id="remDueBadge" class="nav-dot">0</span>
  </button>

<script>
  // ==================== ВСТАВЬ СЮДА СВОЮ ССЫЛКУ APPS SCRIPT ====================
  const API_URL = 'https://script.google.com/macros/s/AKfycbyI0jUwIlFw1ElNp9AuikeZtXYsVqXyLvWY1XZh_R-G6ES3SOd0NvXCjyga8wOPqiDXeA/exec';
  // =============================================================================

  const CACHE_KEY = 'family_fin_cache_v2';
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  let state = {
    user: '',
    users: ['Саша', 'Алина'],
    balances: {
      'Основной': { BYN: 0, USD: 0 },
      'Копилка': { BYN: 0, USD: 0 },
      'Подарочные': { BYN: 0, USD: 0 }
    },
    operations: [],
    reminders: [],
    goals: [],
    categories: { Доход: [], Расход: [] },
    rate: { value: 3.30, source: '—', updated: '' },
    activeAccount: 'Основной',
    summaryCurrency: 'BYN',
    authorFilter: 'Все',
    onlyCurrentAccount: true,
    searchQuery: '',
    remFilter: 'Активно',
    view: 'ops',
    statType: 'Расход',
    statMonth: new Date()
  };

  let modalState = { editId: null, type: 'Расход', currency: 'BYN', category: '' };
  let editingRemId = null;
  let remCurrency = 'BYN';
  let editingGoalId = null;
  let goalCurrency = 'BYN';
  let topUpGoalId = null;

  function esc(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function fmt(num) {
    return Number(num || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }

  function localTodayIso() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function confirmAction(msg, onYes) {
    if (tg && typeof tg.showConfirm === 'function') {
      tg.showConfirm(msg, ok => { if (ok) onYes(); });
    } else if (confirm(msg)) {
      onYes();
    }
  }

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 2600);
  }

  function saveCache() {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        user: state.user,
        users: state.users,
        balances: state.balances,
        operations: state.operations,
        reminders: state.reminders,
        goals: state.goals,
        categories: state.categories,
        rate: state.rate,
        summaryCurrency: state.summaryCurrency
      }));
    } catch (e) {}
  }

  function loadCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return false;
      const c = JSON.parse(raw);
      if (!c || !c.balances) return false;
      state.user = c.user || '';
      state.users = c.users || ['Саша', 'Алина'];
      state.balances = c.balances;
      state.operations = c.operations || [];
      state.reminders = c.reminders || [];
      state.goals = c.goals || [];
      state.categories = c.categories || { Доход: [], Расход: [] };
      state.rate = c.rate || state.rate;
      if (c.summaryCurrency) state.summaryCurrency = c.summaryCurrency;
      return true;
    } catch (e) {
      return false;
    }
  }

  async function apiCall(payload) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ ...payload, initData: tg.initData })
    });
    return res.json();
  }

  async function loadData(forceRate = false) {
    const syncTag = document.getElementById('syncTag');
    syncTag.style.display = 'inline';
    try {
      const data = await apiCall({ appAction: 'getData', forceRate });
      if (!data.ok) {
        document.getElementById('opsList').innerHTML = `<div class="empty">⚠️ ${esc(data.error)}</div>`;
        return;
      }
      state.user = data.user;
      state.users = data.users;
      state.balances = data.balances;
      state.operations = data.operations;
      state.reminders = data.reminders || [];
      state.goals = data.goals || [];
      state.categories = data.categories;
      state.rate = data.rate;
      saveCache();
      renderAll();
      if (forceRate) showToast('Курс обновлён');
    } catch (e) {
      if (!state.operations.length) {
        document.getElementById('opsList').innerHTML = '<div class="empty">Ошибка связи с Google Таблицей. Проверьте API_URL.</div>';
      } else {
        showToast('Нет связи, показаны сохранённые данные');
      }
    } finally {
      syncTag.style.display = 'none';
    }
  }

  function toggleSummaryCurrency() {
    state.summaryCurrency = state.summaryCurrency === 'BYN' ? 'USD' : 'BYN';
    saveCache();
    if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    renderHeaderAndAccount();
    if (state.view === 'stats') renderStats();
  }

  function selectAccount(acc) {
    state.activeAccount = acc;
    document.querySelectorAll('#accountTabs .tab-btn').forEach(b => {
      b.classList.toggle('active', b.textContent === acc);
    });
    if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    renderHeaderAndAccount();
    renderGoals();
    renderOperations();
  }

  function toggleScope() {
    state.onlyCurrentAccount = !state.onlyCurrentAccount;
    renderOperations();
  }

  function setAuthorFilter(name) {
    state.authorFilter = name;
    renderAuthorPills();
    renderOperations();
    renderStats();
  }

  function onSearchInput() {
    const val = document.getElementById('searchInput').value;
    state.searchQuery = val.trim().toLowerCase();
    document.getElementById('searchClear').style.display = val ? 'block' : 'none';
    renderOperations();
  }

  function clearSearch() {
    document.getElementById('searchInput').value = '';
    state.searchQuery = '';
    document.getElementById('searchClear').style.display = 'none';
    renderOperations();
  }

  function switchView(v) {
    state.view = v;
    document.getElementById('viewOps').style.display = v === 'ops' ? 'block' : 'none';
    document.getElementById('viewReminders').style.display = v === 'reminders' ? 'block' : 'none';
    document.getElementById('viewStats').style.display = v === 'stats' ? 'block' : 'none';
    document.getElementById('navOps').classList.toggle('active', v === 'ops');
    document.getElementById('navRem').classList.toggle('active', v === 'reminders');
    document.getElementById('navStats').classList.toggle('active', v === 'stats');
    if (v === 'reminders') renderReminders();
    if (v === 'stats') renderStats();
  }

  function renderAll() {
    document.getElementById('userBadge').textContent = state.user || 'Вы';
    renderHeaderAndAccount();
    renderGoals();
    renderAuthorPills();
    renderOperations();
    renderReminders();
    if (state.view === 'stats') renderStats();
  }

  function renderHeaderAndAccount() {
    const rate = state.rate.value || 3.30;
    let totalByn = 0;
    Object.values(state.balances).forEach(b => {
      totalByn += (b.BYN || 0) + (b.USD || 0) * rate;
    });

    const isUsd = state.summaryCurrency === 'USD';
    const shownTotal = isUsd ? (totalByn / rate) : totalByn;
    document.getElementById('totalAmount').textContent = fmt(shownTotal);
    document.getElementById('summaryCurrBtn').textContent = isUsd ? '$ ⇄' : 'BYN ⇄';
    document.getElementById('rateInfo').textContent =
      `1 $ = ${rate.toFixed(4).replace(/0+$/, '').replace(/\.$/, '')} BYN · ${state.rate.source}`;

    const acc = state.balances[state.activeAccount] || { BYN: 0, USD: 0 };
    document.getElementById('accByn').textContent = `${fmt(acc.BYN)} BYN`;
    document.getElementById('accUsd').textContent = `${fmt(acc.USD)} $`;

    const accTotalByn = acc.BYN + acc.USD * rate;
    const accEq = isUsd ? `${fmt(accTotalByn / rate)} $` : `${fmt(accTotalByn)} BYN`;
    document.getElementById('accTotalEq').textContent = `≈ ${accEq}`;
  }

  function renderAuthorPills() {
    const list = ['Все', ...state.users];
    const html = list.map(u =>
      `<button class="pill ${state.authorFilter === u ? 'active' : ''}" onclick="setAuthorFilter('${esc(u)}')">${esc(u)}</button>`
    ).join('');
    document.getElementById('authorFilters').innerHTML = html;
    document.getElementById('statAuthorFilters').innerHTML = html;
  }

  function renderOperations() {
    const scopeBtn = document.getElementById('scopeBtn');
    const q = state.searchQuery;
    scopeBtn.textContent = (state.onlyCurrentAccount && !q) ? `Счёт: ${state.activeAccount}` : 'Все счета';
    scopeBtn.classList.toggle('active', state.onlyCurrentAccount && !q);

    const filtered = state.operations.filter(op => {
      if (state.authorFilter !== 'Все' && op.author !== state.authorFilter) return false;
      if (!q && state.onlyCurrentAccount && op.account !== state.activeAccount && op.toAccount !== state.activeAccount) return false;
      if (q) {
        const hay = `${op.category} ${op.comment} ${op.account} ${op.toAccount} ${op.author} ${op.amount}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    const sumBox = document.getElementById('searchSummary');
    if (q) {
      const rate = state.rate.value || 3.30;
      let incByn = 0, expByn = 0;
      filtered.forEach(op => {
        const v = op.currency === 'USD' ? op.amount * rate : op.amount;
        if (op.type === 'Доход') incByn += v;
        if (op.type === 'Расход') expByn += v;
      });
      const isUsd = state.summaryCurrency === 'USD';
      const c = isUsd ? '$' : 'BYN';
      const div = isUsd ? rate : 1;
      sumBox.style.display = 'block';
      sumBox.innerHTML = `Найдено: <b>${filtered.length}</b> · Расходы: <b>${fmt(expByn / div)} ${c}</b> · Доходы: <b>${fmt(incByn / div)} ${c}</b>`;
    } else {
      sumBox.style.display = 'none';
    }

    const container = document.getElementById('opsList');
    if (!filtered.length) {
      container.innerHTML = `<div class="empty">${q ? 'По вашему запросу ничего не найдено' : 'Операций пока нет'}</div>`;
      return;
    }

    let html = '';
    let lastDay = '';

    filtered.forEach(op => {
      const day = op.date.slice(0, 10);
      if (day !== lastDay) {
        lastDay = day;
        html += `<div class="date-header">${formatDayLabel(day)}</div>`;
      }

      const curr = op.currency === 'USD' ? '$' : 'BYN';
      let sumHtml = '';
      let title = op.category;
      let sub = `${op.author} · ${op.account}`;

      if (op.type === 'Доход') {
        sumHtml = `<div class="op-sum sum-inc">+${fmt(op.amount)} ${curr}</div>`;
      } else if (op.type === 'Расход') {
        sumHtml = `<div class="op-sum sum-exp">−${fmt(op.amount)} ${curr}</div>`;
      } else if (op.type === 'Перевод') {
        title = `${op.account} → ${op.toAccount}`;
        sub = `${op.author} · Перевод`;
        sumHtml = `<div class="op-sum sum-trf">${fmt(op.amount)} ${curr}</div>`;
      } else if (op.type === 'Обмен') {
        const toCurr = op.toCurrency === 'USD' ? '$' : 'BYN';
        title = `Обмен (${op.account})`;
        sub = `${op.author} · ${fmt(op.amount)} ${curr} → ${fmt(op.toAmount)} ${toCurr}`;
        sumHtml = `<div class="op-sum sum-trf">+${fmt(op.toAmount)} ${toCurr}</div>`;
      }

      if (op.comment) sub += ` · ${op.comment}`;

      html += `
        <div class="op-item">
          <div class="op-left">
            <div class="op-cat">${esc(title)}</div>
            <div class="op-meta">${esc(sub)}</div>
          </div>
          <div class="op-right">
            ${sumHtml}
            <button class="op-act-btn" onclick="openEditOpModal('${esc(op.id)}')" title="Изменить">✏️</button>
            <button class="op-act-btn" onclick="deleteOp('${esc(op.id)}')" title="Удалить">🗑</button>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  function formatDayLabel(isoDay) {
    const parts = String(isoDay || '').split('-');
    if (parts.length !== 3) return isoDay;
    const months = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
    return `${parseInt(parts[2], 10)} ${months[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
  }

  // --- ЦЕЛИ В КОПИЛКЕ ---
  function renderGoals() {
    const box = document.getElementById('goalsBox');
    if (state.activeAccount !== 'Копилка') {
      box.style.display = 'none';
      return;
    }
    box.style.display = 'block';

    const list = state.goals || [];
    const container = document.getElementById('goalsList');
    if (!list.length) {
      container.innerHTML = '<div style="font-size:12px; color:var(--hint); padding:4px 2px;">Целей пока нет — нажмите «+ Цель», чтобы задать ориентир накоплений.</div>';
      return;
    }

    const piggy = state.balances['Копилка'] || { BYN: 0, USD: 0 };
    const rate = state.rate.value || 3.30;

    container.innerHTML = list.map(g => {
      const curr = g.currency === 'USD' ? '$' : 'BYN';
      const current = g.usePiggy
        ? (g.currency === 'USD' ? piggy.USD + piggy.BYN / rate : piggy.BYN + piggy.USD * rate)
        : (g.saved || 0);
      const pct = g.target > 0 ? Math.max(0, Math.min(100, Math.round((current / g.target) * 100))) : 0;
      const left = Math.max(0, g.target - current);

      return `
        <div class="goal-card">
          <div class="goal-top">
            <div class="goal-title">${esc(g.title)} ${g.usePiggy ? '🔗' : ''}</div>
            <div class="goal-actions">
              ${!g.usePiggy ? `<button class="icon-btn green" onclick="openTopUpModal('${esc(g.id)}')">+</button>` : ''}
              <button class="icon-btn" onclick="openGoalModal('${esc(g.id)}')">✏️</button>
              <button class="icon-btn red" onclick="deleteGoal('${esc(g.id)}')">🗑</button>
            </div>
          </div>
          <div class="goal-nums">
            <span>${fmt(current)} / ${fmt(g.target)} ${curr} (<b>${pct}%</b>)</span>
            <span>${left > 0 ? 'Осталось ' + fmt(left) + ' ' + curr : '🎉 Выполнена!'}</span>
          </div>
          <div class="goal-bar-bg"><div class="goal-bar-fill" style="width:${pct}%"></div></div>
        </div>
      `;
    }).join('');
  }

  function openGoalModal(editId = null) {
    editingGoalId = editId;
    const titleEl = document.getElementById('goalModalTitle');
    const btnEl = document.getElementById('saveGoalBtn');

    if (editId) {
      const g = state.goals.find(x => x.id === editId);
      if (!g) return;
      titleEl.textContent = 'Изменить цель';
      btnEl.textContent = 'Сохранить изменения';
      document.getElementById('goalTitle').value = g.title;
      document.getElementById('goalTarget').value = g.target;

  function renderReminders() {
    const today = localTodayIso();
    const dueCount = state.reminders.filter(r => r.status === 'Активно' && r.startDate <= today).length;
    const badge = document.getElementById('remDueBadge');
    badge.textContent = dueCount;
    badge.style.display = dueCount > 0 ? 'inline-block' : 'none';

    const list = state.reminders.filter(r => r.status === state.remFilter);
    const container = document.getElementById('remList');
    if (!list.length) {
      container.innerHTML = state.remFilter === 'Активно'
        ? '<div class="empty">Активных обязательных трат пока нет.<br>Нажмите кнопку выше, чтобы добавить коммуналку, покупку или подарок.</div>'
        : '<div class="empty">Выполненных разовых трат пока нет</div>';
      return;
    }

    container.innerHTML = list.map(r => {
      const isDue = r.status === 'Активно' && r.startDate <= today;
      const curr = r.currency === 'USD' ? '$' : 'BYN';
      let badgeHtml = '';
      if (r.status === 'Выполнено') {
        badgeHtml = '<span class="rem-badge badge-done">✅ Выполнено</span>';
      } else if (isDue) {
        badgeHtml = '<span class="rem-badge badge-due">🔔 Напоминает</span>';
      } else {
        badgeHtml = `<span class="rem-badge badge-wait">⏳ С ${formatDayLabel(r.startDate)}</span>`;
      }

      const metaParts = [
        `Дата: с ${formatDayLabel(r.startDate)}`,
        r.repeat,
        r.category ? `Категория: ${r.category}` : '',
        r.amount > 0 ? `Сумма: ${fmt(r.amount)} ${curr}` : '',
        `Кому: ${r.recipient}`,
        r.autoClose ? '⚡ Автозакрытие' : ''
      ].filter(Boolean).join(' · ');

      const actionsHtml = r.status === 'Активно' ? `
        <div class="rem-actions">
          <button class="rem-btn-done" onclick="markRemDone('${esc(r.id)}','${esc(r.startDate)}',false)">✅ Оплачено</button>
          ${r.amount > 0 ? `<button class="rem-btn-pay" onclick="markRemDone('${esc(r.id)}','${esc(r.startDate)}',true)">💸 В расходы (${fmt(r.amount)} ${curr})</button>` : ''}
          <button class="rem-btn-edit" onclick="openRemModal('${esc(r.id)}')" title="Изменить">✏️</button>
          <button class="rem-btn-del" onclick="deleteRem('${esc(r.id)}')" title="Удалить">🗑</button>

        <div class="rem-actions">
          <button class="rem-btn-del" onclick="deleteRem('${esc(r.id)}')">🗑 Удалить из архива</button>

      return `
        <div class="rem-card ${isDue ? 'due' : ''}">
          <div class="rem-top">
            <div class="rem-title">${esc(r.title)}</div>
            ${badgeHtml}
          </div>
          <div class="rem-meta">${esc(metaParts)}</div>
          ${actionsHtml}
        </div>
      `;
    }).join('');
  }

  function shiftMonth(delta) {

    renderStats();

    renderStats();

  function renderStats() {
    const y = state.statMonth.getFullYear();
    const m = state.statMonth.getMonth();
    const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    document.getElementById('monthLabel').textContent = `${monthNames[m]} ${y}`;

    const prefix = `${y}-${String(m + 1).padStart(2, '0')}`;
    const rate = state.rate.value || 3.30;
    const isUsd = state.summaryCurrency === 'USD';
    const currLabel = isUsd ? '$' : 'BYN';
    const div = isUsd ? rate : 1;

    let monthIncByn = 0;
    let monthExpByn = 0;
    const byCat = {};
    let selectedTotalByn = 0;

    state.operations.forEach(op => {
      if (!op.date.startsWith(prefix)) return;
      if (state.authorFilter !== 'Все' && op.author !== state.authorFilter) return;

      const valByn = op.currency === 'USD' ? op.amount * rate : op.amount;
      if (op.type === 'Доход') monthIncByn += valByn;
      if (op.type === 'Расход') monthExpByn += valByn;

      if (op.type === state.statType) {
        byCat[op.category] = (byCat[op.category] || 0) + valByn;
        selectedTotalByn += valByn;
      }
    });

    const netByn = monthIncByn - monthExpByn;
    document.getElementById('statKpis').innerHTML = `
      <div class="kpi-card">
        <div class="kpi-label">Доходы</div>
        <div class="kpi-val sum-inc">+${fmt(monthIncByn / div)} ${currLabel}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Расходы</div>
        <div class="kpi-val sum-exp">−${fmt(monthExpByn / div)} ${currLabel}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Итог</div>
        <div class="kpi-val" style="color:${netByn >= 0 ? 'var(--green)' : 'var(--red)'};">${netByn >= 0 ? '+' : ''}${fmt(netByn / div)} ${currLabel}</div>
      </div>
    `;

    const container = document.getElementById('statsList');
    const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

    if (!entries.length) {
      container.innerHTML = '<div class="empty">За этот месяц записей нет</div>';
      return;
    }

    let html = '';
    entries.forEach(([cat, valByn]) => {
      const pct = Math.round((valByn / selectedTotalByn) * 100);
      html += `
        <div class="stat-row">
          <div class="stat-top">
            <span>${esc(cat)} (${pct}%)</span>
            <span>${fmt(valByn / div)} ${currLabel}</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  async function submitOperation() {
    const amount = parseFloat(document.getElementById('opAmount').value);
    if (!amount || amount <= 0) { showToast('Введите сумму'); return; }

    const account = document.getElementById('opAccount').value;
    const comment = document.getElementById('opComment').value.trim();
    const date = document.getElementById('opDate').value || localTodayIso();

    const op = {
      type: modalState.type, account, currency: modalState.currency,
      amount, category: modalState.category, comment, date
    };

    if (modalState.type === 'Перевод') {
      const toAccount = document.getElementById('opToAccount').value;
      if (toAccount === account) { showToast('Выберите разные счета для перевода'); return; }
      op.toAccount = toAccount;
      op.toAmount = amount;
      op.toCurrency = modalState.currency;
    } else if (modalState.type === 'Обмен') {
      const toAmount = parseFloat(document.getElementById('opToAmount').value);
      if (!toAmount || toAmount <= 0) { showToast('Укажите сумму получения'); return; }
      op.toAccount = account;
      op.toAmount = toAmount;
      op.toCurrency = modalState.currency === 'BYN' ? 'USD' : 'BYN';
    }

    const isEdit = Boolean(modalState.editId);
    if (isEdit) op.id = modalState.editId;

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Сохраняем...';

    try {
      const res = await apiCall({ appAction: isEdit ? 'updateOp' : 'addOp', op });
      if (res.ok) {
        state.balances = res.balances;
        state.operations = res.operations;
        if (res.reminders) state.reminders = res.reminders;
        saveCache();
        closeModal();
        renderAll();
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        if (res.closedReminders && res.closedReminders.length) {
          showToast('Сохранено + закрыто напоминание!');
        } else {
          showToast(isEdit ? 'Операция обновлена' : 'Сохранено');
        }
      } else {
        showToast(res.error || 'Ошибка сохранения');
      }
    } catch (e) {
      showToast('Ошибка сети');
    } finally {
      btn.disabled = false;
      btn.textContent = isEdit ? 'Сохранить изменения' : 'Сохранить';
    }
  }

  function deleteOp(id) {
    confirmAction('Удалить эту операцию?', async () => {
      try {
        const res = await apiCall({ appAction: 'deleteOp', id });
        if (res.ok) {
          state.balances = res.balances;
          state.operations = res.operations;
          saveCache();
          renderAll();
          showToast('Удалено');
        }
      } catch (e) {
        showToast('Не удалось удалить');
      }
    });
  }

  if (loadCache()) {
    renderAll();
  }
  loadData();
</script>
</body>
</html>
